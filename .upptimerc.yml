# Configuration of the public status page, repository SSStudio-Git/lera-status. Copied there by
# hand: it runs on GitHub, on purpose, so it keeps answering when LeraLink does not.
# docs/hardening/PHASE_7_STATUS.md. Never list staging or an internal address here.
owner: SSStudio-Git
repo: lera-status

sites:
  - name: LeraLink
    url: https://hub.lera.link/
  - name: LeraLink API
    url: https://hub.lera.link/api/health
    __dangerous__body_down_if_text_missing: '"status":"ok"'
  # Behind Cloudflare Access: a redirect to its sign-in counts as up, so it is not followed.
  - name: Platform administration
    url: https://admin.lera.link/api/health
    maxRedirects: 0
    expectedStatusCodes: [200, 302, 303]

status-website:
  cname: status.lera.link
  name: LeraLink status
  introTitle: "**LeraLink status**"
  introMessage: Whether LeraLink is up right now, checked from outside it.
  navbar:
    - title: Status
      href: /
    - title: LeraLink
      href: https://lera.link
